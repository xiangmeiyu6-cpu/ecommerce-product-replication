name: Verify macOS and Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Regression tests
        run: node --test test/manager.test.mjs test/quality.test.mjs test/feishu.test.mjs
      - name: Fixed Feishu template integrity
        run: node skill/scripts/validate_feishu_template.mjs
      - name: Public file audit
        run: node tools/audit-public.mjs
      - name: Deterministic package build
        run: node tools/build-release.mjs
